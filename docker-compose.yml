version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: consultancy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/consultancy
      APP_STORAGE: /app/storage
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend/storage:/app/storage
volumes:
  pgdata:
